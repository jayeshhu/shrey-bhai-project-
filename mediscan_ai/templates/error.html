{% extends "base.html" %}
{% block title %}{{ code }} — MediScan AI{% endblock %}

{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg-base);background-image:radial-gradient(ellipse at 50% 50%,rgba(59,130,246,0.06) 0%,transparent 70%)">
  <div style="text-align:center;max-width:480px">
    <div style="font-size:80px;margin-bottom:16px;line-height:1">
      {% if code == 404 %}😕
      {% elif code == 403 %}🚫
      {% elif code == 413 %}📦
      {% else %}⚠️{% endif %}
    </div>
    <div style="font-size:80px;font-weight:900;color:var(--border);margin-bottom:8px">{{ code }}</div>
    <h1 style="font-size:24px;font-weight:800;margin-bottom:12px">{{ title }}</h1>
    <p style="color:var(--text-secondary);font-size:15px;line-height:1.6;margin-bottom:28px">{{ message }}</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="/dashboard" class="btn btn-primary">🏠 Go to Dashboard</a>
      <a href="javascript:history.back()" class="btn btn-outline">← Go Back</a>
    </div>
  </div>
</div>
{% endblock %}
